# ============================================================
# cotejaERP - Configuración principal
# ============================================================

spring.application.name=cotejaERP

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/coteja_erp?useSSL=false&serverTimezone=America/El_Salvador&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway (migraciones)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Email (SMTP salida)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@empresa.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Importacion facturas de compra (IMAP)
coteja.purchase.imap.host=${PURCHASE_INVOICE_MAIL_HOST:imap.gmail.com}
coteja.purchase.imap.port=${PURCHASE_INVOICE_MAIL_PORT:993}
coteja.purchase.imap.username=${PURCHASE_INVOICE_MAIL_USERNAME:}
coteja.purchase.imap.password=${PURCHASE_INVOICE_MAIL_PASSWORD:}
coteja.purchase.imap.encryption=ssl

# DTE El Salvador - Firmador
coteja.dte.firmador.url=${DTE_FIRMADOR_URL:http://localhost:8113}

# Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.com.coteja=DEBUG
logging.level.org.springframework.security=INFO
